version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to DockerHub
      - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

  build:
    commands:
      - echo Building backend image
      - docker build -t akanksha2501/devbank-backend:v2 ./backend

      - echo Building frontend image
      - docker build -t akanksha2501/devbank-frontend:v3 ./frontend

  post_build:
    commands:
      - echo Pushing backend image
      - docker push akanksha2501/devbank-backend:v2

      - echo Pushing frontend image
      - docker push akanksha2501/devbank-frontend:v3

      - echo Build completed
